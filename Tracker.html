<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Special+Gothic+Expanded+One&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./Tracker.css">

</head>
  <body>
    <div class="header">
      <p class="m-0">Expense<br>Tracker
        <img src="https://thumbs.dreamstime.com/z/wallet-filled-money-tool-icon-vector-sign-symbol-isolated-white-background-logo-concept-your-web-mobile-app-design-134168746.jpg?ct=jpeg" alt="" width="35px; height:35px;">
      </p>
    </div>

    <div class="input-form">

      <div class="form-floating inputs">
  <input type="text" class="form-control amount-input" id="floatingInput" placeholder="name@example.com">
  <label for="floatingInput">Amount</label>
</div>
<select class="form-select inputs transaction-type" aria-label="Default select example">
  <option selected>Transaction Type</option>
  <option value="income">Income</option>
  <option value="Expenses">Expenses</option>
  <!-- <option value="3">Three</option> -->
</select>
<div class="form-floating inputs">
  <input type="date" class="form-control date-input" id="floatingInput" placeholder="name@example.com">
  <label for="floatingInput">Date</label>
</div>
<button class="btn" id="add-button" onclick="addRow()">+</button>

    </div>

    <div class="cards mt-4">
      <div class="card" >
  <div class="card-body">
    <h5 class="card-title m-0">Total income
      <img src="./assets/wallet-money.png" alt="" width="20px">
    </h5>
    <h1 class="m-0">
      <img src="./assets/currency.png" alt="" width="35px">
      <span id="total-income" class="m-0">0</span>
    </h1> 
  </div>
</div>

<div class="card">
  <div class="card-body">
    <h5 class="card-title m-0">Total expense
      <img src="./assets/wallet-spending.png" alt="" width="25px">
    </h5>
    <h1 class="m-0">
      <img src="./assets/currency.png" alt="" width="35px">
      <span id="expense" class="m-0">0</span>
    </h1> 
  </div>
</div>

<div class="card">
  <div class="card-body">
    <h5 class="card-title m-0">Balance
      <img src="./assets/money-bag.png" alt="" width="20px">
    </h5>
    <h1 class="m-0">
      <img src="./assets/currency.png" alt="" width="35px">
      <span id="balance" class="m-0">0</span>
    </h1> 
  </div>
</div>
    </div>

    <table class="transaction-table mt-3" id="table">
      <tr id="header-row">
        <th>Amount</th>
        <th>Transaction-Type</th>
        <th>Transaction-Date</th>
        <th>Action</th>
      </tr>
     
    </table>

    <script>
      let table=document.getElementById('table')
      console.log("Table:" ,table);

      function deleteRow(row){
        console.log('remove from delete function')
        console.log(row);
        row.remove();

      }

      function addRow() {
        let amount = document.getElementsByClassName('amount-input')[0].value
        let transactionType = document.getElementsByClassName('transaction-type')[0].value
        let date = document.getElementsByClassName('date-input')[0].value
        
        let row = document.createElement('tr')

        let amountcell=document.createElement('td')
        amountcell.innerText=amount;

        let transactioncell=document.createElement('td')
        transactioncell.innerText=transactionType;

        let datecell=document.createElement('td')
        datecell.innerText=date;

        let binCell=document.createElement('td')

        let deleteButton=document.createElement('button')

        let binImage=document.createElement('img')
        binImage.src='./assets/delete-logo.png'
        binImage.style.width='25px'
        binImage.style.height='25px'
        deleteButton.classList.add('delete-button')
        deleteButton.onclick=()=> deleteRow(row)

        deleteButton.appendChild(binImage)
        binCell.appendChild(deleteButton);

        row.appendChild(amountcell)
        row.appendChild(transactioncell)
        row.appendChild(datecell)
        row.appendChild(binCell)

        table.appendChild(row)

        let totalIncome=document.getElementById('total-income').innerText
        let totalExpense=document.getElementById('expense').innerText
        let balance=document.getElementById('balance').innerText

        if(transactionType =='income'){
          if(totalIncome == '0'){
            document.getElementById('total-income').innerText=amount
          }
          else{
            document.getElementById('total-income').innerText=parseInt(totalIncome)+parseInt(amount)
          }
        }

        else if(transactionType == "Expenses"){
          if(totalExpense == "0"){
            document.getElementById('expense').innerText=amount
          }
          else{
            document.getElementById("expense").innerText=parseInt(totalExpense)+parseInt(amount)
          }
        }

        if(balance=="0"){
          document.getElementById('balance').innerText=amount
        }
        else{
          document.getElementById('balance').innerText=parseInt(balance)+parseInt(amount)

        }

        if(balance=="0"){
          document.getElementById('balance').innerText=amount
        }
        else{
          document.getElementById('balance').innerText=parseInt(balance)-parseInt(amount)

        }

        console.log("Line 146:",totalIncome,totalExpense,balance)

        console.log("Line 118: ",amountcell,transactioncell,datecell)

      }
    </script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>  
</body>
</html>
